[project]
name = "mixput"
version = "0.1.9"
description = "Cross-platform keyboard and mouse sharing between laptops."
readme = "README.md"
authors = [
    { name = "Under Our Eyes.org", email = "underoureyes8@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "packaging>=26.3",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pynput>=1.7.7",
    "cryptography>=44.0.0",
    "requests>=2.34.2",
    "tkinter-icons>=5.1.0",
    "tkinter-icons-lucide>=1.1.1",
]

[project.scripts]
mixput = "mixput:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
