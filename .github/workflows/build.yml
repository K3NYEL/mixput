name: Build and Release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente que se desea empaquetar (ej. v0.1.3)"
        required: true
        default: "v0.1.3"
  push:
    branches:
      - local-charges
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} installer
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve application version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python -c "import os,tomllib; e=os.environ; v=e['INPUT_TAG'] if e['EVENT_NAME']=='workflow_dispatch' else e['REF_NAME'] if e['EVENT_NAME']=='push' else tomllib.load(open('pyproject.toml','rb'))['project']['version']; v=v.removeprefix('v').strip(); assert v and all(c.isalnum() or c in '.+-' for c in v), f'Invalid version: {v!r}'; open(e['GITHUB_OUTPUT'],'a').write('value='+v+chr(10))"

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Validate Python sources
        run: python -m compileall -q src

      - name: Build standalone application
        run: python -m PyInstaller --clean --noconfirm mixput.spec

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $version = $env:APP_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') { throw "Invalid application version: '$version'" }
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          }
          if (-not $iscc) {
            $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (Test-Path $candidate) { $iscc = @{ Source = $candidate } }
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          New-Item -ItemType Directory -Force -Path "dist/packages" | Out-Null
          & $iscc.Source "/DAppVersion=$version" "installer/windows/mixput.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Package release
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist/packages
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path 'dist/mixput.exe' -DestinationPath 'dist/packages/mixput-windows-x64.zip' -Force"
          else
            chmod +x dist/mixput
            zip -j "dist/packages/mixput-linux-x64.zip" "dist/mixput"
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixput-installer-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
